# Decap CMS 配置文件
# 文档：https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: yara1006/yara1006.github.io
  branch: main
  client_id: Ov23liuRnAYGlfL1md16

# 媒体文件夹（存放图片等）
media_folder: "assets"
public_folder: "/assets"

# 内容集合定义
collections:
  # 比赛记录集合 - 使用 Markdown 文件
  - name: "competitions"
    label: "比赛记录"
    folder: "_competitions"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "比赛名称", name: "title", widget: "string" }
      - { label: "英文名", name: "title_en", widget: "string", required: false }
      - { label: "比赛日期", name: "date", widget: "string", pattern: ["^[0-9]{4}\\.[0-9]{2}$", "格式：YYYY.MM"] }
      - { label: "奖项", name: "award", widget: "string" }
      - { label: "奖项（英文）", name: "award_en", widget: "string", required: false }
      - { label: "比赛简介", name: "intro", widget: "markdown", required: false }
      - { label: "比赛简介（英文）", name: "intro_en", widget: "markdown", required: false }
      - { label: "比赛内容", name: "content_text", widget: "markdown", required: false, hint: "支持 Markdown 格式" }
      - { label: "我的角色", name: "role", widget: "markdown", required: false }
      - { label: "收获与反思", name: "reflection", widget: "markdown", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "相关链接", name: "links", widget: "list", fields: [
          { label: "链接文字", name: "text", widget: "string" },
          { label: "链接地址", name: "url", widget: "string" }
        ], required: false }

  # 网站设置（可选）
  - name: "settings"
    label: "网站设置"
    files:
      - label: "主页设置"
        name: "home"
        file: "site-data/home.yml"
        fields:
          - { label: "姓名", name: "name", widget: "string" }
          - { label: "职位", name: "title", widget: "string" }
          - { label: "一句话介绍", name: "subtitle", widget: "text", required: false }
          - { label: "邮箱", name: "email", widget: "string", required: false }
          - { label: "GitHub", name: "github", widget: "string", required: false }
