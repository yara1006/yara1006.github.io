<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | 杨韩冰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#fafafa; --card:#fff; --text:#1a1a2e; --text-secondary:#555770; --text-muted:#8b8fa3; --accent:#2563eb; --accent-light:#dbeafe; --border:#e8e8ee; --radius:10px; }
[data-theme="dark"] { --bg:#0f0f14; --card:#1a1a24; --text:#e8e8f0; --text-secondary:#a0a0b8; --text-muted:#6b6b80; --accent:#60a5fa; --accent-light:#1e3a5f; --border:#2a2a3a; }
*{margin:0;padding:0;box-sizing:border-box} html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,250,250,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 24px}
[data-theme="dark"] nav{background:rgba(15,15,20,0.85)}
.nav-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.nav-logo{font-family:'Crimson Pro','Noto Serif SC',serif;font-size:18px;font-weight:700;color:var(--text);text-decoration:none}
.nav-right{display:flex;align-items:center;gap:20px}
.nav-links{display:flex;gap:20px;list-style:none}
.nav-links a{color:var(--text-muted);text-decoration:none;font-size:13px;font-weight:500;transition:0.15s}
.nav-links a:hover{color:var(--text)}
.nav-toggles{display:flex;align-items:center;gap:6px}
.lang-toggle{display:flex;background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.lang-btn{padding:4px 10px;font-size:12px;font-weight:600;border:none;background:transparent;color:var(--text-muted);cursor:pointer;transition:0.15s;font-family:inherit}
.lang-btn.active{background:var(--accent);color:#fff}
.theme-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:0.15s}
.theme-btn:hover{border-color:var(--accent)}
.theme-icon-dark{display:none}
[data-theme="dark"] .theme-icon-light{display:none}
[data-theme="dark"] .theme-icon-dark{display:inline}

main{max-width:800px;margin:0 auto;padding:0 24px}

.breadcrumb{font-size:13px;color:var(--text-muted);margin-top:80px;margin-bottom:12px}
.breadcrumb a{color:var(--text-muted);text-decoration:none}
.breadcrumb a:hover{color:var(--accent)}

.page-header{padding:20px 0 32px}
.page-header h1{font-family:'Crimson Pro','Noto Serif SC',serif;font-size:36px;font-weight:700;margin-bottom:8px}
.page-header p{font-size:15px;color:var(--text-secondary)}

.timeline{padding:20px 0 60px;position:relative}
.timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;padding-left:28px;margin-bottom:32px}
.tl-item::before{content:'';position:absolute;left:-5px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl-date{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:4px}
.tl-title{font-family:'Crimson Pro','Noto Serif SC',serif;font-size:18px;font-weight:700;margin-bottom:4px}
.tl-award{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px}
.tl-desc{font-size:14px;color:var(--text-secondary);line-height:1.7;margin-bottom:10px}
.tl-link{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:13px;font-weight:600;text-decoration:none}
.tl-link:hover{text-decoration:underline}

.comp-header{padding-bottom:32px}
.comp-meta{display:flex;gap:12px;margin-bottom:12px;font-size:13px;color:var(--text-muted)}
.comp-award{color:var(--accent);font-weight:600}
.comp-title{font-family:'Crimson Pro','Noto Serif SC',serif;font-size:32px;font-weight:700;margin-bottom:4px;line-height:1.3}
.comp-title-en{font-size:16px;color:var(--text-secondary);font-weight:400}

.comp-section{padding:24px 0;border-top:1px solid var(--border)}
.comp-section h2{font-family:'Crimson Pro','Noto Serif SC',serif;font-size:22px;font-weight:700;margin-bottom:16px}
.comp-content{font-size:15px;color:var(--text-secondary);line-height:1.8}
.comp-content ul{margin:12px 0 12px 20px}
.comp-content li{margin-bottom:8px}
.comp-content-en{margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);font-size:14px;color:var(--text-muted)}

.comp-reflection{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:24px;font-size:14px;color:var(--text-secondary);line-height:1.8}

.comp-tags{display:flex;flex-wrap:wrap;gap:8px;padding:24px 0;border-top:1px solid var(--border)}
.comp-tag{padding:4px 14px;background:var(--accent-light);color:var(--accent);border-radius:100px;font-size:13px;font-weight:500}

.nav-bottom{display:flex;justify-content:space-between;padding:32px 0;border-top:1px solid var(--border);margin-top:32px}
.nav-bottom a{font-size:14px;color:var(--accent);text-decoration:none;font-weight:600}
.nav-bottom a:hover{text-decoration:underline}

footer{padding:40px 0;border-top:1px solid var(--border);text-align:center;font-size:13px;color:var(--text-muted)}

@media(max-width:640px){.comp-title{font-size:24px}.nav-links{display:none}}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="nav-logo">杨韩冰</a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}">主页</a></li>
        <li><a href="{{ '/competitions/' | relative_url }}">比赛</a></li>
      </ul>
      <div class="nav-toggles">
        <div class="lang-toggle">
          <button class="lang-btn active" data-lang="zh">中</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="theme-btn" id="themeToggle"><span class="theme-icon-light">🌙</span><span class="theme-icon-dark">☀️</span></button>
      </div>
    </div>
  </div>
</nav>

<main>
  <div class="breadcrumb"><a href="{{ '/' | relative_url }}">主页</a> / <a href="{{ '/competitions/' | relative_url }}">比赛记录</a> / {{ page.title }}</div>

  {{ content }}

  <div class="nav-bottom">
    <a href="{{ '/competitions/' | relative_url }}">← 返回比赛列表</a>
  </div>

  <footer><p>杨韩冰 · 2026</p></footer>
</main>

<script>
const tt=document.getElementById('themeToggle');const sv=localStorage.getItem('theme');if(sv)document.documentElement.setAttribute('data-theme',sv);tt.addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n)});
</script>
</body>
</html>
