# Jekyll 配置文件
title: "杨韩冰 | AI 产品经理"
description: "计算机本科在读，两段企业级 AI 产品实习经验"
url: "https://yara1006.github.io"
baseurl: ""

# 不处理这些文件/目录
exclude:
  - README.md
  - .gitignore
  - photo.jpg

# 集合定义
collections:
  competitions:
    output: true
    permalink: /competitions/:slug/
  articles:
    output: true
    permalink: /articles/:slug/

# 默认 frontmatter 值
defaults:
  - scope:
      path: ""
      type: "competitions"
    values:
      layout: "competition"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"
